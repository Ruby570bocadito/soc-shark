name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain estable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Caché de dependencias
        uses: Swatinem/rust-cache@v2

      - name: Formato (rustfmt)
        run: cargo fmt --all -- --check

      - name: Lints (clippy, warnings = errores)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests unitarios y de integración
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release

      - name: Fuzzing determinista en proceso (parsers + agregador + SOC + DSL)
        run: ./target/release/socshark dev fuzz --iterations 50000 --seed 42 --report-every 0
