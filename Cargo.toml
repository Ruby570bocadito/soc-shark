[workspace]
resolver = "2"
members = [
    "crates/socshark-core",
    "crates/socshark-capture",
    "crates/socshark-dissectors",
    "crates/socshark-flow",
    "crates/socshark-filter",
    "crates/socshark-soc",
    "crates/socshark-ebpf-common",
    "crates/socshark-testgen",
    "crates/socshark-cli",
]
# cargo-fuzz (nightly) y su generador de semillas viven fuera del workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.9.1"
edition = "2021"
license = "MIT"
authors = ["soc-shark contributors"]
repository = "https://github.com/Ruby570bocadito/soc-shark"
rust-version = "1.88"

[workspace.dependencies]
# Crates internos
socshark-core = { path = "crates/socshark-core" }
socshark-capture = { path = "crates/socshark-capture" }
socshark-dissectors = { path = "crates/socshark-dissectors" }
socshark-flow = { path = "crates/socshark-flow" }
socshark-filter = { path = "crates/socshark-filter" }
socshark-soc = { path = "crates/socshark-soc" }
socshark-ebpf-common = { path = "crates/socshark-ebpf-common" }
socshark-testgen = { path = "crates/socshark-testgen" }

# Dependencias externas (mínimas a propósito: ver docs/decisions.md)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
