[package]
name = "socshark-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "soc-shark: binario principal (análisis de capturas, motor SOC y CLI)"

[[bin]]
name = "soc-shark"
path = "src/main.rs"

[dependencies]
socshark-common = { path = "../crates/common" }
socshark-capture-core = { path = "../crates/capture-core" }
socshark-dissectors = { path = "../crates/dissectors" }
socshark-flow-aggregator = { path = "../crates/flow-aggregator" }
socshark-soc-engine = { path = "../crates/soc-engine" }
socshark-filter-dsl = { path = "../crates/filter-dsl" }
socshark-storage-index = { path = "../crates/storage-index" }
