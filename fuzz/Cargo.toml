# Fuzzing guiado por cobertura (cargo-fuzz + libFuzzer).
#
# NO es miembro del workspace raíz (excluido en ../Cargo.toml): necesita
# nightly y sanitizers, y el CI estable no debe compilarlo. Uso:
#
#   cargo +nightly fuzz run dns
#
# Ver fuzz/README.md y CONTRIBUTING.md (sección Fuzzing).
[package]
name = "socshark-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
socshark-core = { path = "../crates/socshark-core" }
socshark-capture = { path = "../crates/socshark-capture" }
socshark-dissectors = { path = "../crates/socshark-dissectors" }
socshark-filter = { path = "../crates/socshark-filter" }
socshark-soc = { path = "../crates/socshark-soc" }

# Workspace propio: así cargo no intenta incluir este paquete en el raíz.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "dns"
path = "fuzz_targets/dns.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipv4"
path = "fuzz_targets/ipv4.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipv6"
path = "fuzz_targets/ipv6.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tcp"
path = "fuzz_targets/tcp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "udp"
path = "fuzz_targets/udp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tls"
path = "fuzz_targets/tls.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dissect"
path = "fuzz_targets/dissect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pcap"
path = "fuzz_targets/pcap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "carve"
path = "fuzz_targets/carve.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filter"
path = "fuzz_targets/filter.rs"
test = false
doc = false
bench = false
